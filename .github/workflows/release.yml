name: Publish HACS release

on:
  push:
    branches:
      - main
    paths:
      - dist/homeon-energy-card.js
      - dist/homeon_logo.svg
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homeon-energy-card-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release files
        shell: bash
        run: |
          set -euo pipefail
          test -f homeon-energy-card.js
          test -f dist/homeon-energy-card.js
          test -f homeon_logo.svg
          test -f dist/homeon_logo.svg
          cmp -s homeon-energy-card.js dist/homeon-energy-card.js
          cmp -s homeon_logo.svg dist/homeon_logo.svg
          grep -q '<title>HomeOn logo extracted from photo</title>' dist/homeon_logo.svg
          node --check dist/homeon-energy-card.js
          test ! -e homeon-test-card.js
          test ! -e homeon-operator-fresh.js
          test ! -e homeon-operator-pretty.js
          test ! -e homeon-logo-injector.js
          test ! -e dist/homeon-energy-card-0405.js
          test ! -e dist/homeon-energy-card-v044.js

      - name: Read card version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/.*HomeOn Energy Card \([0-9][0-9.]*\) loaded.*/\1/p' dist/homeon-energy-card.js | tail -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish release with HACS assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "HomeOn Energy Card $VERSION" --generate-notes
          fi
          gh release upload "$tag" dist/homeon-energy-card.js dist/homeon_logo.svg --clobber

      - name: Keep only the two newest versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t keep_tags < <(
            gh release list --limit 100 --json tagName,publishedAt \
              --jq 'sort_by(.publishedAt) | reverse | .[0:2] | .[].tagName'
          )
          test "${#keep_tags[@]}" -eq 2

          should_keep() {
            [[ "$1" == "${keep_tags[0]}" || "$1" == "${keep_tags[1]}" ]]
          }

          while IFS= read -r old_tag; do
            [[ -z "$old_tag" ]] && continue
            if ! should_keep "$old_tag"; then
              gh release delete "$old_tag" --yes --cleanup-tag
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')

          while IFS= read -r tag_ref; do
            [[ -z "$tag_ref" ]] && continue
            tag="${tag_ref#refs/tags/}"
            if ! should_keep "$tag"; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
            fi
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags" --jq '.[].ref')

          printf 'Pozostawione wersje: %s, %s\n' "${keep_tags[0]}" "${keep_tags[1]}"
